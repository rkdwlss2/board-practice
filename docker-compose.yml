services:
  opensearch:
    build:
      context: ./opensearch
    image: board-practice-opensearch:local
    container_name: board-practice-opensearch
    profiles:
      - local
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin!123456
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"

  board-practice:
    build:
      context: .
      dockerfile: Dockerfile
    image: board-practice:dev
    container_name: board-practice
    env_file:
      - /etc/board-practice.env
    ports:
      - "8080:8080"
    restart: unless-stopped
