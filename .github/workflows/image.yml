name: CI/CD to Docker Hub & EC2 (BE & FE)

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  # 1. 백엔드 빌드 & Docker Hub 푸시
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/board-practice-backend:latest

  # 2. 프론트엔드 빌드 & Docker Hub 푸시
  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Repository
        uses: actions/checkout@v4

      # FE 레포지토리가 별도 레포지토리인 경우 가져오기
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4
        with:
          repository: rkdwlss2/board-practice-FE
          path: board-practice-FE
          # 만약 FE 레포지토리가 비공개(Private)라면 아래 line 주석 해제 후 PAT 지정 필요
          # token: ${{ secrets.GH_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./board-practice-FE
          file: ./board-practice-FE/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/board-practice-frontend:latest
          build-args: |
            VITE_API_URL=/api
  # 3. Redis 커스텀 이미지 빌드 & Docker Hub 푸시 (추가)
  build-and-push-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Redis Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis.Dockerfile  # 작성하신 Redis Dockerfile 경로
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/board-practice-redis:latest
  # 3. EC2 서버에 신규 이미지 배포
  deploy:
    needs: [build-and-push-backend, build-and-push-frontend, build-and-push-redis]
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub Actions IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Add IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-03f8a7da49f40909e \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/boardproject/board-practice
            git pull origin master
            
            # 최신 백엔드/프론트엔드 이미지 받아오기 및 컨테이너 재시동
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f

      - name: Remove IP from Security Group (Always Run)
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-03f8a7da49f40909e \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
