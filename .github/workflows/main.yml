name: Deploy to EC2 with Docker Compose

on:
  workflow_dispatch:
  push:
    branches:
      - main  # main 브랜치에 push 될 때 자동 배포

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 가져오기 (가장 먼저 실행되어야 함)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/board-backend:latest

      # 4. GitHub Actions IP 가져오기
      - name: Get GitHub Actions IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 5. AWS 인증 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 6. 보안 그룹에 IP 추가 (SSH 허용)
      - name: Add IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-03f8a7da49f40909e \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # 7. EC2 접속 후 이미지 pull 및 실행
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app  # 실제 EC2 내 docker-compose.yml 위치 경로로 변경해주세요
            docker compose pull
            docker compose up -d --remove-orphans

      # 8. 보안 그룹에서 IP 제거 (항상 실행)
      - name: Remove IP from Security Group (Always Run)
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-03f8a7da49f40909e \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
