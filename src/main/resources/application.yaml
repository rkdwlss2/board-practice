spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: board-practice
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_ADDRESS:localhost:3306}/boardpractice?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update   # 개발 중에는 create / create-drop / update 중 선택
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true
server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false
cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: board-project-russell
upload:
  directory: ./uploads

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:qwen/qwen3.6-27b}

logging:
  level:
    org:
      springframework:
        jdbc:
          core:
            JdbcTemplate: DEBUG
            StatementCreatorUtils: TRACE
cors:
  allowed-origins:
    - http://localhost:5500
    - http://127.0.0.1:5500
    - http://localhost:5173
    - http://${public.ip:localhost}:5173
    - http://${public.ip:localhost}
